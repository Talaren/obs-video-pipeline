name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg shellcheck shfmt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check Bash syntax, lint, and formatting
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          bash -n "${shell_files[@]}" .githooks/pre-commit
          shellcheck "${shell_files[@]}" .githooks/pre-commit
          shfmt -d -i 2 -ci "${shell_files[@]}" .githooks/pre-commit

      - name: Run control-flow tests
        run: ./tests/test_process_videos.sh

      - name: Run x264 benchmark control-flow tests
        run: ./tests/test_benchmark_x264.sh

      - name: Run media smoke tests
        run: ./tests/test_media_pipeline.sh

      - name: Run uploader unit tests
        run: python -m unittest tests/test_yt_upload.py
